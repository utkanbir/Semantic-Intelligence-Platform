apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: sip-dev

resources:
  - ../../base

labels:
  - pairs:
      environment: dev

# S13–S17: pin images to avoid stale :dev cache (TD-016 pattern)
images:
  - name: sip-backend:dev
    newName: sip-backend
    newTag: s14
  - name: sip-console:dev
    newName: sip-console
    newTag: s19
