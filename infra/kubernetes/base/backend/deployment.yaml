apiVersion: apps/v1
kind: Deployment
metadata:
  name: sip-backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: sip-backend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: sip-backend
    spec:
      containers:
        - name: backend
          image: sip-backend:dev
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - configMapRef:
                name: sip-backend-config
            - secretRef:
                name: sip-backend-secrets
          readinessProbe:
            httpGet:
              path: /api/v1/health/ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /api/v1/health/live
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
