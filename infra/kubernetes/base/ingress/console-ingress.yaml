apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: sip-console
spec:
  ingressClassName: nginx
  rules:
    - host: console.sip.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: sip-console
                port:
                  number: 80
