apiVersion: apps/v1
kind: Deployment
metadata:
  name: sip-console
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: sip-console
  template:
    metadata:
      labels:
        app.kubernetes.io/name: sip-console
    spec:
      containers:
        - name: console
          image: sip-console:dev
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
