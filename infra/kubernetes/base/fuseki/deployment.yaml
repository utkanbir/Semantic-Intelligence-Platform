apiVersion: apps/v1
kind: Deployment
metadata:
  name: sip-fuseki
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: sip-fuseki
  template:
    metadata:
      labels:
        app.kubernetes.io/name: sip-fuseki
    spec:
      containers:
        - name: fuseki
          image: stain/jena-fuseki:5.1.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3030
          env:
            - name: ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: sip-fuseki-secrets
                  key: FUSEKI_ADMIN_PASSWORD
          readinessProbe:
            httpGet:
              path: /$/ping
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /$/ping
              port: http
            initialDelaySeconds: 15
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          volumeMounts:
            - name: fuseki-data
              mountPath: /fuseki
      volumes:
        - name: fuseki-data
          emptyDir: {}
