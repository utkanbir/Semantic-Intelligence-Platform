# Keep SIP MVP Delivery board columns in sync with PR/issue lifecycle.
# PO requirement: visible In Progress / In Review / Done during sprint — not batch at close.
name: Project Board Sync

on:
  pull_request:
    types: [opened, reopened, ready_for_review, closed]
  issues:
    types: [opened, milestoned, reopened]

permissions:
  contents: read
  pull-requests: read
  issues: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Parse issue number from PR
        if: github.event_name == 'pull_request'
        id: pr_issue
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          python3 <<'PY'
          import os, re, sys
          title = os.environ["PR_TITLE"]
          m = re.search(r"\[#(\d+)\]", title) or re.search(r"#(\d+)\b", title)
          if not m:
              print("No issue number in PR title; expected [#123] prefix", file=sys.stderr)
              sys.exit(0)
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as f:
              f.write(f"number={m.group(1)}\n")
          PY

      - name: PR opened → In Review
        if: >
          github.event_name == 'pull_request' &&
          github.event.action != 'closed' &&
          steps.pr_issue.outputs.number != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/board_sync.py \
            --issue "${{ steps.pr_issue.outputs.number }}" \
            --status "In Review" \
            --add-to-project

      - name: PR merged → Done
        if: >
          github.event_name == 'pull_request' &&
          github.event.action == 'closed' &&
          github.event.pull_request.merged == true &&
          steps.pr_issue.outputs.number != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/board_sync.py \
            --issue "${{ steps.pr_issue.outputs.number }}" \
            --status "Done" \
            --add-to-project

      - name: Milestone issue → Ready on board
        if: github.event_name == 'issues'
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          if [ -z "${{ github.event.issue.milestone.title }}" ]; then
            echo "Issue has no milestone; skip board add"
            exit 0
          fi
          python3 scripts/board_sync.py \
            --issue "$ISSUE_NUMBER" \
            --status "Ready" \
            --add-to-project
