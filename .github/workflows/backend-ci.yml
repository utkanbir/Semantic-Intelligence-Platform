name: Backend CI

on:
  pull_request:
    branches: [develop]
  push:
    branches: [develop]

permissions:
  contents: read

concurrency:
  group: backend-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-ci:
    name: Backend CI
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Contract sync (S36-05)
        run: python ../scripts/verify_contract_sync.py
        env:
          PYTHONPATH: .

      - name: Semantic lineage taxonomy sync (S37-04)
        run: python ../scripts/verify_semantic_lineage_sync.py
        env:
          PYTHONPATH: .

      - name: Ruff lint
        run: ruff check .

      - name: Mypy type check
        run: mypy app

      - name: Pytest smoke
        run: pytest --tb=short -q
