name: Spike
description: Time-boxed investigation or proof of concept
title: "[Spike] "
labels: ["type:spike", "architecture"]
body:
  - type: textarea
    id: objective
    attributes:
      label: Objective
      description: What question or risk is being investigated?
    validations:
      required: true
  - type: textarea
    id: architecture_refs
    attributes:
      label: Architecture references
      description: D-*, R-*, DM-*, API-*, ARR-*
    validations:
      required: true
  - type: textarea
    id: mvp_scope
    attributes:
      label: MVP scope reference
      description: Related MVP area, or N/A
    validations:
      required: true
  - type: checkboxes
    id: modules
    attributes:
      label: Affected modules
      options:
        - label: applications
        - label: discovery
        - label: blueprints
        - label: assets
        - label: ontology
        - label: knowledge_graph
        - label: products
        - label: agents
        - label: agent_runtime
        - label: governance
        - label: adapters
        - label: audit_trace
        - label: platform_admin
        - label: core / shared
        - label: infra / docs
  - type: textarea
    id: dependencies
    attributes:
      label: Dependencies
      placeholder: "None"
    validations:
      required: true
  - type: textarea
    id: acceptance_criteria
    attributes:
      label: Acceptance criteria
      description: Deliverables (findings doc, recommendation, prototype)
    validations:
      required: true
  - type: textarea
    id: out_of_scope
    attributes:
      label: Out of scope
    validations:
      required: true
  - type: textarea
    id: qa_scenarios
    attributes:
      label: QA scenarios
      description: How findings will be validated or reviewed
    validations:
      required: true
