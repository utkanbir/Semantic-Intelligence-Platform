name: Bug Report
description: Defect or regression
title: "[Bug] "
labels: ["type:bug"]
body:
  - type: textarea
    id: objective
    attributes:
      label: Objective
      description: What is broken and expected behavior?
    validations:
      required: true
  - type: textarea
    id: architecture_refs
    attributes:
      label: Architecture references
      description: D-*, R-*, DM-*, API-*, ARR-* if applicable
      placeholder: "N/A"
    validations:
      required: true
  - type: textarea
    id: mvp_scope
    attributes:
      label: MVP scope reference
      description: Affected MVP area, or N/A
    validations:
      required: true
  - type: checkboxes
    id: modules
    attributes:
      label: Affected modules
      options:
        - label: applications
        - label: discovery
        - label: blueprints
        - label: assets
        - label: ontology
        - label: knowledge_graph
        - label: products
        - label: agents
        - label: agent_runtime
        - label: governance
        - label: adapters
        - label: audit_trace
        - label: platform_admin
        - label: core / shared
        - label: infra / docs
  - type: textarea
    id: api_contract
    attributes:
      label: API contract impact
      placeholder: "None"
    validations:
      required: true
  - type: textarea
    id: domain_events
    attributes:
      label: Domain events impact
      placeholder: "None"
    validations:
      required: true
  - type: textarea
    id: trace_expectations
    attributes:
      label: Semantic Transaction / Trace Step expectations
    validations:
      required: true
  - type: textarea
    id: dependencies
    attributes:
      label: Dependencies
      placeholder: "None"
    validations:
      required: true
  - type: textarea
    id: acceptance_criteria
    attributes:
      label: Acceptance criteria
      description: How we know the bug is fixed
    validations:
      required: true
  - type: textarea
    id: out_of_scope
    attributes:
      label: Out of scope
    validations:
      required: true
  - type: textarea
    id: qa_scenarios
    attributes:
      label: QA scenarios
      description: Steps to reproduce and verify fix
    validations:
      required: true
